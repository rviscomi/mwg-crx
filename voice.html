<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Voice Typing - Ask Dino</title>
    <style>
      :root {
        --bg-primary: #121318;
        --bg-secondary: #1a1c24;
        --bg-tertiary: #222632;
        --accent-gradient: linear-gradient(135deg, #4f46e5 0%, #a855f7 100%);
        --text-primary: #f3f4f6;
        --text-secondary: #9ca3af;
        --border-color: #2e3440;
        --accent-color: #4f46e5;
        --danger-color: #ef4444;
        --font-sans: 'Inter', system-ui, sans-serif;
      }

      body {
        font-family: var(--font-sans);
        background-color: var(--bg-primary);
        color: var(--text-primary);
        margin: 0;
        padding: 20px;
        display: flex;
        flex-direction: column;
        height: 100vh;
        box-sizing: border-box;
        overflow: hidden;
      }

      .header {
        font-size: 13px;
        font-weight: 600;
        color: var(--text-secondary);
        margin-bottom: 12px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        text-align: center;
      }

      .rec-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 15px;
        flex-grow: 1;
      }

      .mic-ring {
        position: relative;
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background-color: rgba(239, 68, 68, 0.1);
        display: flex;
        align-items: center;
        justify-content: center;
        border: 2px solid var(--danger-color);
      }

      .mic-ring::before {
        content: '';
        position: absolute;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        border: 2px solid var(--danger-color);
        opacity: 0.6;
        animation: pulse-ring 1.8s infinite cubic-bezier(0.215, 0.61, 0.355, 1);
      }

      .mic-icon {
        font-size: 24px;
        color: var(--danger-color);
        z-index: 2;
      }

      @keyframes pulse-ring {
        0% {
          transform: scale(0.95);
          opacity: 0.8;
        }
        50% {
          opacity: 0.3;
        }
        100% {
          transform: scale(1.6);
          opacity: 0;
        }
      }

      .preview-box {
        background-color: var(--bg-secondary);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 12px 16px;
        width: 100%;
        box-sizing: border-box;
        font-size: 14px;
        color: var(--text-primary);
        min-height: 70px;
        max-height: 80px;
        overflow-y: auto;
        word-break: break-word;
        font-style: italic;
        line-height: 1.5;
        text-align: center;
      }

      .preview-placeholder {
        color: var(--text-secondary);
      }

      .controls {
        display: flex;
        gap: 10px;
        justify-content: center;
        margin-top: 15px;
        width: 100%;
      }

      .btn {
        font-family: var(--font-sans);
        font-size: 13px;
        font-weight: 600;
        padding: 8px 18px;
        border-radius: 6px;
        border: none;
        cursor: pointer;
        transition: all 0.2s ease;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .btn-primary {
        background: var(--accent-gradient);
        color: white;
      }

      .btn-primary:hover {
        opacity: 0.9;
        box-shadow: 0 0 12px rgba(99, 102, 241, 0.3);
      }

      .btn-secondary {
        background-color: var(--bg-tertiary);
        color: var(--text-secondary);
        border: 1px solid var(--border-color);
      }

      .btn-secondary:hover {
        background-color: var(--bg-secondary);
        color: var(--text-primary);
      }
    </style>
  </head>
  <body>
    <div class="header" id="status-text">Listening...</div>
    <div class="rec-container">
      <div class="mic-ring" id="mic-ring">
        <span class="mic-icon">🎙️</span>
      </div>
      <div class="preview-box" id="preview-box">
        <span class="preview-placeholder">Speak to dictate your message...</span>
      </div>
    </div>
    <div class="controls">
      <button id="btn-cancel" class="btn btn-secondary">Cancel</button>
      <button id="btn-done" class="btn btn-primary">Done</button>
    </div>
    <script src="voice.js"></script>
  </body>
</html>
