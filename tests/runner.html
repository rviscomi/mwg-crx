<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Modern Web Dino - Unit Tests</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
      --success: #10b981;
      --failure: #ef4444;
      --border-color: #334155;
    }
    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      max-width: 800px;
      width: 100%;
    }
    header {
      margin-bottom: 30px;
      text-align: center;
    }
    h1 {
      margin: 0 0 10px 0;
      font-size: 28px;
      background: linear-gradient(135deg, #60a5fa, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .summary {
      display: flex;
      gap: 20px;
      justify-content: center;
      margin-bottom: 30px;
    }
    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 15px 25px;
      text-align: center;
      min-width: 100px;
    }
    .stat-val {
      font-size: 24px;
      font-weight: bold;
    }
    .stat-val.passed { color: var(--success); }
    .stat-val.failed { color: var(--failure); }
    .stat-label {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 5px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .test-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .test-case {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 20px;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .test-case:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
    }
    .test-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
    .test-name {
      font-size: 16px;
      font-weight: 600;
    }
    .badge {
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 4px;
      font-weight: bold;
      text-transform: uppercase;
    }
    .badge.passed {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
    }
    .badge.failed {
      background: rgba(239, 68, 68, 0.15);
      color: var(--failure);
    }
    .details {
      font-family: monospace;
      font-size: 13px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 6px;
      padding: 12px;
      margin-top: 10px;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .diff {
      margin-top: 8px;
      border-top: 1px dashed var(--border-color);
      padding-top: 8px;
    }
    .diff-expected { color: var(--success); }
    .diff-actual { color: var(--failure); }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Parser Unit Tests</h1>
      <p style="color: var(--text-muted);">Validating thought and content separation heuristics</p>
    </header>

    <div class="summary">
      <div class="stat-card">
        <div class="stat-val" id="total-tests">0</div>
        <div class="stat-label">Total</div>
      </div>
      <div class="stat-card">
        <div class="stat-val passed" id="passed-tests">0</div>
        <div class="stat-label">Passed</div>
      </div>
      <div class="stat-card">
        <div class="stat-val failed" id="failed-tests">0</div>
        <div class="stat-label">Failed</div>
      </div>
    </div>

    <div class="test-list" id="test-results">
      <!-- Test results will be populated here -->
    </div>
  </div>

  <script src="../parser.js"></script>
  <script src="tests.js"></script>
</body>
</html>
